<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 NEXUS Encryption Tool - Advanced AES-256</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-size: 12px;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-encrypt {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-encrypt:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-decrypt {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-decrypt:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 87, 108, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .info {
            font-size: 12px;
            color: #666;
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 6px;
            line-height: 1.6;
        }

        .loading {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: currentColor;
            border-radius: 50%;
            animation: loading 1.4s infinite;
            margin-left: 5px;
        }

        @keyframes loading {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .copy-btn {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            margin-left: 10px;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 NEXUS Encryption</h1>
        <p class="subtitle">AES-256-CBC + PBKDF2 + HMAC-SHA256</p>

        <div class="form-group">
            <label for="webhook">🔗 Discord Webhook URL</label>
            <input type="text" id="webhook" placeholder="https://discord.com/api/webhooks/..." />
        </div>

        <div class="form-group">
            <label for="password">🔑 Encryption Password (Min 8 chars)</label>
            <input type="password" id="password" placeholder="Enter strong password" minlength="8" />
        </div>

        <div class="button-group">
            <button class="btn-encrypt" onclick="encryptWebhook()">🔒 Encrypt</button>
            <button class="btn-decrypt" onclick="decryptWebhook()">🔓 Decrypt</button>
        </div>

        <div id="message" class="message"></div>

        <div class="form-group">
            <label for="result">📋 Result</label>
            <textarea id="result" readonly placeholder="Encrypted/Decrypted result will appear here"></textarea>
            <button class="copy-btn" onclick="copyToClipboard()">📋 Copy</button>
        </div>

        <div class="info">
            <strong>⚙️ Security Info:</strong><br>
            ✓ AES-256-CBC encryption<br>
            ✓ PBKDF2 key derivation (100,000 iterations)<br>
            ✓ HMAC-SHA256 authentication<br>
            ✓ Random salt & IV per encryption<br>
            ✓ All operations run locally in your browser
        </div>

        <div id="status" style="text-align: center; margin-top: 20px; font-size: 12px; color: #999;">
            Ready
        </div>
    </div>

    <script async src="crypto.js"></script>
    <script>
        let Module = {
            onRuntimeInitialized: function() {
                document.getElementById('status').textContent = '✅ Encryption engine ready';
            }
        };

        function updateStatus(msg) {
            document.getElementById('status').textContent = msg;
        }

        function showMessage(text, type) {
            const msgEl = document.getElementById('message');
            msgEl.textContent = text;
            msgEl.className = 'message ' + type;
            msgEl.style.display = 'block';
            setTimeout(() => msgEl.style.display = 'none', 5000);
        }

        async function encryptWebhook() {
            const webhook = document.getElementById('webhook').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('result');

            if (!webhook) {
                showMessage('❌ Please enter webhook URL', 'error');
                return;
            }

            if (password.length < 8) {
                showMessage('❌ Password must be at least 8 characters', 'error');
                return;
            }

            try {
                updateStatus('🔄 Encrypting...');

                if (typeof Module === 'undefined' || !Module.ccall) {
                    showMessage('⏳ Encryption engine loading... Try again in 2 seconds', 'error');
                    return;
                }

                const encrypted = Module.ccall('encrypt_data', 'string', 
                    ['string', 'string'], 
                    [webhook, password]
                );

                if (!encrypted) {
                    showMessage('❌ Encryption failed', 'error');
                    updateStatus('Error');
                    return;
                }

                result.value = encrypted;
                showMessage('✅ Webhook encrypted successfully!', 'success');
                updateStatus('✅ Complete');
            } catch (error) {
                console.error('Encryption error:', error);
                showMessage('❌ ' + error.message, 'error');
                updateStatus('Error');
            }
        }

        async function decryptWebhook() {
            const encrypted = document.getElementById('result').value;
            const password = document.getElementById('password').value;
            const result = document.getElementById('result');

            if (!encrypted) {
                showMessage('❌ Please enter encrypted data', 'error');
                return;
            }

            if (password.length < 8) {
                showMessage('❌ Password must be at least 8 characters', 'error');
                return;
            }

            try {
                updateStatus('🔄 Decrypting...');

                if (typeof Module === 'undefined' || !Module.ccall) {
                    showMessage('⏳ Encryption engine loading... Try again in 2 seconds', 'error');
                    return;
                }

                const decrypted = Module.ccall('decrypt_data', 'string', 
                    ['string', 'string'], 
                    [encrypted, password]
                );

                if (!decrypted) {
                    showMessage('❌ Decryption failed - wrong password or corrupted data', 'error');
                    updateStatus('Error');
                    return;
                }

                result.value = decrypted;
                showMessage('✅ Webhook decrypted successfully!', 'success');
                updateStatus('✅ Complete');
            } catch (error) {
                console.error('Decryption error:', error);
                showMessage('❌ ' + error.message, 'error');
                updateStatus('Error');
            }
        }

        function copyToClipboard() {
            const result = document.getElementById('result');
            if (!result.value) {
                showMessage('❌ Nothing to copy', 'error');
                return;
            }

            navigator.clipboard.writeText(result.value).then(() => {
                showMessage('✅ Copied to clipboard!', 'success');
            }).catch(err => {
                showMessage('❌ Copy failed', 'error');
            });
        }

        // Enter key support
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') encryptWebhook();
        });

        document.getElementById('webhook').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') encryptWebhook();
        });
    </script>
</body>
</html>
